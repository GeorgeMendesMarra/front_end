<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exemplo 3 - Formulário</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container my-5" style="max-width: 640px;">

    <h1 class="h3 mb-4">Cadastro de aluno</h1>

    <!-- "needs-validation" + novalidate: o Bootstrap mostra os erros em vermelho/verde -->
    <form class="needs-validation card card-body shadow-sm" novalidate>

      <div class="mb-3">
        <label for="nome" class="form-label">Nome completo</label>
        <input type="text" class="form-control" id="nome" required>
        <div class="invalid-feedback">Digite seu nome.</div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" placeholder="nome@exemplo.com" required>
        <div class="invalid-feedback">Digite um e-mail válido.</div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="curso" class="form-label">Curso</label>
          <select class="form-select" id="curso" required>
            <option value="">Escolha...</option>
            <option>Análise e Desenvolvimento de Sistemas</option>
            <option>Ciência da Computação</option>
            <option>Sistemas de Informação</option>
          </select>
          <div class="invalid-feedback">Escolha um curso.</div>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label d-block">Turno</label>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="turno" id="manha" checked>
            <label class="form-check-label" for="manha">Manhã</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="turno" id="noite">
            <label class="form-check-label" for="noite">Noite</label>
          </div>
        </div>
      </div>

      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="termos" required>
        <label class="form-check-label" for="termos">Li e aceito os termos</label>
        <div class="invalid-feedback">Você precisa aceitar para continuar.</div>
      </div>

      <button class="btn btn-primary w-100" type="submit">Enviar cadastro</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Ativa a validação do Bootstrap: impede o envio se houver campo inválido
    document.querySelectorAll('.needs-validation').forEach(form => {
      form.addEventListener('submit', e => {
        if (!form.checkValidity()) { e.preventDefault(); e.stopPropagation(); }
        form.classList.add('was-validated');
      });
    });
  </script>
</body>
</html>
