<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jQuery 01 - Primeiros passos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .destacado { background-color: #fff3cd; border-left: 5px solid #ffc107; padding: 8px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container"><span class="navbar-brand">jQuery: Primeiros passos</span></div>
  </nav>

  <div class="container">

    <!-- 1. SELETORES -->
    <h2 id="titulo">Seletores</h2>
    <p class="destaque">Parágrafo com a classe <code>destaque</code>.</p>
    <p class="destaque">Outro parágrafo com a mesma classe.</p>
    <p>Parágrafo comum, sem classe.</p>

    <div class="mb-4">
      <button id="btnId" class="btn btn-primary">Por id (#)</button>
      <button id="btnClasse" class="btn btn-success">Por classe (.)</button>
      <button id="btnTag" class="btn btn-secondary">Por tag (p)</button>
      <button id="btnReset" class="btn btn-outline-dark">Limpar</button>
    </div>

    <!-- 2. TEXTO E HTML -->
    <h2>Lendo e alterando conteúdo</h2>
    <div id="caixa" class="p-3 border rounded mb-3">Conteúdo original da caixa.</div>
    <button id="btnTexto" class="btn btn-info">.text()</button>
    <button id="btnHtml" class="btn btn-warning">.html()</button>
    <button id="btnLer" class="btn btn-outline-primary">Ler conteúdo</button>

    <!-- 3. CSS E CLASSES -->
    <h2 class="mt-4">CSS e classes</h2>
    <div id="alvo" class="p-3 border rounded mb-3">Eu sou o alvo das mudanças de estilo.</div>
    <button id="btnCss" class="btn btn-danger">.css()</button>
    <button id="btnClasseAdd" class="btn btn-success">.addClass()</button>
    <button id="btnClasseToggle" class="btn btn-secondary">.toggleClass()</button>

    <div id="saida" class="alert alert-light border mt-4">A saída dos exemplos aparece aqui.</div>
  </div>

  <!-- jQuery vem ANTES do seu código -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    // Só executa quando o HTML terminou de carregar
    $(document).ready(function () {

      // Seletor por id
      $("#btnId").click(function () {
        $("#titulo").css("color", "royalblue");
        $("#saida").text("Selecionado por id: #titulo");
      });

      // Seletor por classe (pega TODOS os elementos com a classe)
      $("#btnClasse").click(function () {
        $(".destaque").addClass("destacado");
        $("#saida").text("Selecionado por classe: " + $(".destaque").length + " elementos");
      });

      // Seletor por tag
      $("#btnTag").click(function () {
        $("p").css("font-style", "italic");
        $("#saida").text("Selecionado por tag: todos os <p>");
      });

      $("#btnReset").click(function () {
        $("#titulo").css("color", "");
        $(".destaque").removeClass("destacado");
        $("p").css("font-style", "");
        $("#saida").text("Tudo limpo.");
      });

      // .text() troca só texto; .html() interpreta tags
      $("#btnTexto").click(function () {
        $("#caixa").text("<b>Isso aparece como texto puro</b>");
      });
      $("#btnHtml").click(function () {
        $("#caixa").html("<b>Isso aparece em negrito</b>");
      });
      $("#btnLer").click(function () {
        $("#saida").text("Conteúdo da caixa: " + $("#caixa").text());
      });

      // CSS e classes
      $("#btnCss").click(function () {
        $("#alvo").css({ "background-color": "tomato", "color": "white" });
      });
      $("#btnClasseAdd").click(function () {
        $("#alvo").addClass("bg-success text-white");
      });
      $("#btnClasseToggle").click(function () {
        $("#alvo").toggleClass("shadow-lg");
      });

    });
  </script>
</body>
</html>
