<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jQuery 02 - Eventos e efeitos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #bola { width: 60px; height: 60px; background: #0d6efd; border-radius: 50%; position: relative; }
    .area-hover { transition: none; cursor: pointer; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container"><span class="navbar-brand">jQuery: Eventos e efeitos</span></div>
  </nav>

  <div class="container">

    <!-- EVENTOS -->
    <h2>Eventos</h2>
    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <button id="btnClique" class="btn btn-primary w-100">Clique (click)</button>
        <p id="contador" class="mt-2">Cliques: 0</p>
      </div>
      <div class="col-md-4">
        <div id="areaHover" class="area-hover p-4 border rounded text-center">Passe o mouse aqui (hover)</div>
      </div>
      <div class="col-md-4">
        <input id="campoTecla" class="form-control" placeholder="Digite algo (keyup)">
        <p id="eco" class="mt-2 text-muted"></p>
      </div>
    </div>

    <!-- EFEITOS -->
    <h2>Efeitos de mostrar e esconder</h2>
    <div class="mb-2">
      <button id="btnHide" class="btn btn-danger">hide</button>
      <button id="btnShow" class="btn btn-success">show</button>
      <button id="btnFade" class="btn btn-warning">fadeToggle</button>
      <button id="btnSlide" class="btn btn-info">slideToggle</button>
    </div>
    <div id="painel" class="alert alert-primary">Sou o painel que aparece e desaparece com os efeitos.</div>

    <!-- ANIMATE -->
    <h2 class="mt-4">Animação personalizada</h2>
    <div class="mb-3">
      <button id="btnDireita" class="btn btn-outline-primary">Mover →</button>
      <button id="btnEsquerda" class="btn btn-outline-primary">← Voltar</button>
      <button id="btnCrescer" class="btn btn-outline-success">Crescer</button>
    </div>
    <div class="border rounded p-2 mb-4" style="overflow:hidden">
      <div id="bola"></div>
    </div>

    <!-- EVENTO COM on() E DELEGAÇÃO -->
    <h2>Elementos criados depois (delegação com .on)</h2>
    <button id="btnNovo" class="btn btn-dark mb-2">Criar botão</button>
    <div id="lista"></div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    $(function () {   // atalho de $(document).ready

      // click
      var cliques = 0;
      $("#btnClique").click(function () {
        cliques++;
        $("#contador").text("Cliques: " + cliques);
      });

      // hover: função de entrada e de saída
      $("#areaHover").hover(
        function () { $(this).addClass("bg-warning"); },
        function () { $(this).removeClass("bg-warning"); }
      );

      // keyup: executa a cada tecla solta
      $("#campoTecla").on("keyup", function () {
        $("#eco").text("Você digitou: " + $(this).val());
      });

      // Efeitos
      $("#btnHide").click(function () { $("#painel").hide(400); });
      $("#btnShow").click(function () { $("#painel").show(400); });
      $("#btnFade").click(function () { $("#painel").fadeToggle(600); });
      $("#btnSlide").click(function () { $("#painel").slideToggle(600); });

      // animate: só propriedades numéricas
      $("#btnDireita").click(function () {
        $("#bola").animate({ left: "300px" }, 800);
      });
      $("#btnEsquerda").click(function () {
        $("#bola").animate({ left: "0px" }, 800);
      });
      $("#btnCrescer").click(function () {
        $("#bola").animate({ width: "+=20px", height: "+=20px" }, 400);
      });

      // Delegação: o evento é ligado ao pai e vale para filhos criados depois
      var n = 0;
      $("#btnNovo").click(function () {
        n++;
        $("#lista").append('<button class="btn btn-outline-dark me-2 mb-2 item">Botão ' + n + '</button>');
      });
      $("#lista").on("click", ".item", function () {
        $(this).fadeOut(300, function () { $(this).remove(); });
      });

    });
  </script>
</body>
</html>
